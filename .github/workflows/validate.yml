name: validate

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-aiplatform-shared-swc

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and lint every template
        run: |
          for template in infra/main.bicep infra/modules/*.bicep; do
            az bicep build --file "$template" --stdout --only-show-errors > /dev/null
            az bicep lint --file "$template" --only-show-errors
          done

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview the deployment against the shared resource group
        env:
          ALERT_EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL_ADDRESS }}
        run: az deployment group what-if --resource-group "$RESOURCE_GROUP" --parameters infra/main.bicepparam --only-show-errors
