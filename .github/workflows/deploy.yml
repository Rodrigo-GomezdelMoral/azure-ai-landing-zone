name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Required reviewers and the main-only branch rule live on this environment; its name is in the OIDC subject.
    environment: production
    env:
      ALERT_EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL_ADDRESS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the Bicep CLI
        run: |
          az config set bicep.use_binary_from_path=false --only-show-errors
          az bicep install --version v0.47.16 --only-show-errors

      - name: Sign in with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if for the run log
        run: make what-if

      - name: Deploy
        run: make deploy

      - name: Approve the Search billing link on Foundry
        run: make approve-links
